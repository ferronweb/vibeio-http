[package]
name = "vibeio-http-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.11.1"
http = "1.4.0"
http-body-util = "0.1.3"
libfuzzer-sys = "0.4"
tokio = "1.52.3"
vibeio = "0.2.10"
vibeio-http = { path = "..", features = ["h1","h2","h3"] }

[[bin]]
name = "http1"
path = "fuzz_targets/http1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http2_frames"
path = "fuzz_targets/http2_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack_decode"
path = "fuzz_targets/hpack_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack_decode"
path = "fuzz_targets/qpack_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack_encode"
path = "fuzz_targets/qpack_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http3_frames"
path = "fuzz_targets/http3_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http3_control"
path = "fuzz_targets/http3_control.rs"
test = false
doc = false
bench = false
